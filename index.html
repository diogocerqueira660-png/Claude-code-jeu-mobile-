<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Route Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; background: #111; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    /* Format portrait 9:16 */
    aspect-ratio: 9 / 16;
    height: min(100vh, calc(100vw * 16 / 9));
    height: min(100dvh, calc(100vw * 16 / 9));
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4%;
    background: rgba(0,0,0,.6); color: #fff; text-align: center; padding: 8%;
  }
  .overlay h1 { font-size: min(11vw, 6dvh); letter-spacing: 2px; text-shadow: 0 4px 0 #e63946; }
  .overlay p { font-size: min(4.5vw, 2.5dvh); opacity: .9; line-height: 1.4; }
  .overlay button {
    font-size: min(6vw, 3.4dvh); font-weight: 700; padding: .6em 1.6em; border: 0;
    border-radius: 999px; background: #ffd23f; color: #111; box-shadow: 0 6px 0 #b8901a;
  }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8901a; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="540" height="960"></canvas>
  <div id="menu" class="overlay">
    <h1>ROUTE RUSH</h1>
    <p>Esquive les voitures,<br>ramasse les pièces ⭐<br><br>Glisse le doigt ou touche<br>gauche / droite pour tourner</p>
    <button id="play">JOUER</button>
    <p id="best"></p>
  </div>
  <div id="over" class="overlay hidden">
    <h1>CRASH !</h1>
    <p id="final"></p>
    <button id="again">REJOUER</button>
  </div>
</div>
<script>
(() => {
  const W = 540, H = 960;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // Canvas net sur écrans haute densité
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  const ROAD_L = 70, ROAD_R = W - 70, LANES = 4;
  const LANE_W = (ROAD_R - ROAD_L) / LANES;
  const laneX = i => ROAD_L + LANE_W * (i + .5);
  const CAR_W = 62, CAR_H = 110;
  const COLORS = ['#3a86ff', '#8338ec', '#fb5607', '#06d6a0', '#ff006e', '#f1faee'];

  let state = 'menu', player, enemies, coins, particles, speed, dist, score, spawnT, coinT, scroll, shake, last;
  let best = +(localStorageGet('rr_best') || 0);
  $('best').textContent = best ? 'Record : ' + best : '';

  function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function reset() {
    player = { x: laneX(1.5), y: H - 190, tx: laneX(1.5), tilt: 0 };
    enemies = []; coins = []; particles = [];
    speed = 420; dist = 0; score = 0; spawnT = 0; coinT = 1; scroll = 0; shake = 0;
  }

  // ---------- Contrôles ----------
  const input = { left: false, right: false, dragX: null };
  function toGameX(clientX) {
    const r = cv.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }
  let dragStart = null, dragMoved = false;
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const gx = toGameX(e.clientX);
    dragStart = { gx, px: player.tx }; dragMoved = false;
    if (gx < W / 2) input.left = true; else input.right = true;
  });
  window.addEventListener('pointermove', e => {
    if (!dragStart || state !== 'play') return;
    const gx = toGameX(e.clientX);
    if (Math.abs(gx - dragStart.gx) > 12) { dragMoved = true; input.left = input.right = false; }
    if (dragMoved) player.tx = clampX(dragStart.px + (gx - dragStart.gx) * 1.3);
  });
  const endTouch = () => { dragStart = null; input.left = input.right = false; };
  window.addEventListener('pointerup', endTouch);
  window.addEventListener('pointercancel', endTouch);
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'a') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'a') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
  });
  const clampX = x => Math.max(ROAD_L + CAR_W / 2 + 4, Math.min(ROAD_R - CAR_W / 2 - 4, x));

  $('play').onclick = start;
  $('again').onclick = start;

  function start() {
    reset();
    state = 'play';
    $('menu').classList.add('hidden');
    $('over').classList.add('hidden');
    if (navigator.vibrate) navigator.vibrate(20);
  }

  function gameOver() {
    state = 'over'; shake = 18;
    for (let i = 0; i < 40; i++) particles.push({
      x: player.x, y: player.y, vx: (Math.random() - .5) * 600, vy: (Math.random() - .5) * 600,
      life: 1, c: Math.random() < .5 ? '#ffd23f' : '#e63946', r: 3 + Math.random() * 5
    });
    if (navigator.vibrate) navigator.vibrate([80, 40, 120]);
    if (score > best) { best = score; localStorageSet('rr_best', best); }
    setTimeout(() => {
      $('final').innerHTML = 'Score : <b>' + score + '</b><br>Record : ' + best;
      $('over').classList.remove('hidden');
      $('best').textContent = 'Record : ' + best;
    }, 700);
  }

  // ---------- Logique ----------
  function spawnEnemy() {
    const lane = Math.floor(Math.random() * LANES);
    if (enemies.some(en => en.lane === lane && en.y < 150)) return;
    // Laisse toujours au moins une voie libre en haut
    const topLanes = new Set(enemies.filter(en => en.y < 200).map(en => en.lane));
    if (topLanes.size >= LANES - 1 && !topLanes.has(lane)) return;
    enemies.push({
      lane, x: laneX(lane), y: -CAR_H, v: 120 + Math.random() * 160,
      c: COLORS[Math.floor(Math.random() * COLORS.length)], truck: Math.random() < .18
    });
  }

  function hit(a, b, aw, ah, bw, bh) {
    return Math.abs(a.x - b.x) < (aw + bw) / 2 - 8 && Math.abs(a.y - b.y) < (ah + bh) / 2 - 10;
  }

  function update(dt) {
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.4; }
    particles = particles.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt * 40);
    if (state !== 'play') { scroll += 60 * dt; return; }

    speed = Math.min(1100, speed + 12 * dt);
    dist += speed * dt;
    score = Math.floor(dist / 50) + (player.coins || 0) * 25;
    scroll += speed * dt;

    // Direction
    const steer = 520 + speed * .3;
    if (input.left) player.tx = clampX(player.tx - steer * dt);
    if (input.right) player.tx = clampX(player.tx + steer * dt);
    const dx = player.tx - player.x;
    player.x += dx * Math.min(1, dt * 12);
    player.tilt = Math.max(-.35, Math.min(.35, dx * .012));

    // Ennemis
    spawnT -= dt;
    if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(.28, 1.1 - speed / 1400) * (.6 + Math.random() * .6); }
    for (const en of enemies) {
      en.y += (speed - en.v) * dt;
      const h = en.truck ? CAR_H * 1.6 : CAR_H;
      if (hit(player, en, CAR_W, CAR_H, CAR_W + (en.truck ? 6 : 0), h)) { gameOver(); return; }
    }
    enemies = enemies.filter(en => en.y < H + 250);

    // Pièces
    coinT -= dt;
    if (coinT <= 0) { coins.push({ x: laneX(Math.floor(Math.random() * LANES)), y: -40, t: 0 }); coinT = 1 + Math.random() * 1.5; }
    for (const co of coins) {
      co.y += speed * dt; co.t += dt;
      if (!co.got && hit(player, co, CAR_W, CAR_H, 40, 40)) {
        co.got = true; player.coins = (player.coins || 0) + 1;
        for (let i = 0; i < 12; i++) particles.push({
          x: co.x, y: co.y, vx: (Math.random() - .5) * 300, vy: (Math.random() - .5) * 300,
          life: .8, c: '#ffd23f', r: 3
        });
        if (navigator.vibrate) navigator.vibrate(10);
      }
    }
    coins = coins.filter(co => !co.got && co.y < H + 50);

    // Fumée du pot d'échappement
    if (Math.random() < .5) particles.push({
      x: player.x + (Math.random() - .5) * 20, y: player.y + CAR_H / 2,
      vx: (Math.random() - .5) * 30, vy: 120, life: .5, c: 'rgba(200,200,200,.5)', r: 4
    });
  }

  // ---------- Rendu ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawCar(x, y, color, tilt, isPlayer, truck) {
    const w = CAR_W, h = truck ? CAR_H * 1.6 : CAR_H;
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0);
    // ombre
    ctx.fillStyle = 'rgba(0,0,0,.35)'; roundRect(-w / 2 + 5, -h / 2 + 8, w, h, 14); ctx.fill();
    // roues
    ctx.fillStyle = '#111';
    for (const sy of [-h / 2 + 22, h / 2 - 26]) { ctx.fillRect(-w / 2 - 4, sy - 11, 8, 22); ctx.fillRect(w / 2 - 4, sy - 11, 8, 22); }
    // carrosserie
    ctx.fillStyle = color; roundRect(-w / 2, -h / 2, w, h, 14); ctx.fill();
    if (truck) {
      ctx.fillStyle = 'rgba(0,0,0,.15)'; roundRect(-w / 2 + 5, -h / 2 + 50, w - 10, h - 58, 6); ctx.fill();
      ctx.fillStyle = '#9ad1ff'; roundRect(-w / 2 + 8, -h / 2 + 10, w - 16, 24, 5); ctx.fill();
    } else {
      // pare-brise / lunette
      ctx.fillStyle = '#1d2d44';
      roundRect(-w / 2 + 8, -h / 2 + 24, w - 16, 24, 6); ctx.fill();
      roundRect(-w / 2 + 9, h / 2 - 34, w - 18, 16, 5); ctx.fill();
      // toit
      ctx.fillStyle = 'rgba(255,255,255,.18)'; roundRect(-w / 2 + 10, -h / 2 + 50, w - 20, 26, 6); ctx.fill();
    }
    if (isPlayer) {
      ctx.fillStyle = '#fff'; ctx.fillRect(-4, -h / 2 + 2, 8, h - 4); // bande de course
      ctx.fillStyle = '#fff6a0'; ctx.fillRect(-w / 2 + 6, -h / 2, 12, 5); ctx.fillRect(w / 2 - 18, -h / 2, 12, 5);
    }
    ctx.fillStyle = '#ff2a2a'; ctx.fillRect(-w / 2 + 6, h / 2 - 5, 12, 5); ctx.fillRect(w / 2 - 18, h / 2 - 5, 12, 5);
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    // herbe
    ctx.fillStyle = '#3f8f3a'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#367c32';
    const s = scroll % 80;
    for (let y = -80 + s; y < H; y += 80) { ctx.fillRect(0, y, ROAD_L, 40); ctx.fillRect(ROAD_R, y + 40, W - ROAD_R, 40); }
    // arbres
    for (let i = 0; i < 6; i++) {
      const ty = ((i * 190 + scroll) % (H + 200)) - 100;
      for (const tx of [30, W - 30]) {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(tx + 5, ty + 6, 24, 0, 7); ctx.fill();
        ctx.fillStyle = '#2d6a2a'; ctx.beginPath(); ctx.arc(tx, ty, 24, 0, 7); ctx.fill();
        ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.arc(tx - 6, ty - 6, 12, 0, 7); ctx.fill();
      }
    }
    // route
    ctx.fillStyle = '#3b3b40'; ctx.fillRect(ROAD_L, -20, ROAD_R - ROAD_L, H + 40);
    // bordures rouge/blanc
    const bs = scroll % 60;
    for (let y = -60 + bs; y < H; y += 60) {
      ctx.fillStyle = '#e63946'; ctx.fillRect(ROAD_L - 12, y, 12, 30); ctx.fillRect(ROAD_R, y, 12, 30);
      ctx.fillStyle = '#fff'; ctx.fillRect(ROAD_L - 12, y + 30, 12, 30); ctx.fillRect(ROAD_R, y + 30, 12, 30);
    }
    // lignes de voies
    ctx.fillStyle = '#e8e8e8';
    const ls = scroll % 100;
    for (let i = 1; i < LANES; i++) {
      const lx = ROAD_L + LANE_W * i - 3;
      for (let y = -100 + ls; y < H; y += 100) ctx.fillRect(lx, y, 6, 50);
    }

    // pièces
    for (const co of coins) {
      const sx = Math.abs(Math.cos(co.t * 5));
      ctx.save(); ctx.translate(co.x, co.y); ctx.scale(Math.max(.15, sx), 1);
      ctx.fillStyle = '#b8901a'; ctx.beginPath(); ctx.arc(0, 3, 18, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff3b0'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', 0, 1);
      ctx.restore();
    }

    for (const en of enemies) drawCar(en.x, en.y, en.c, 0, false, en.truck);
    if (player && state !== 'over') drawCar(player.x, player.y, '#e63946', player.tilt, true);
    if (player && state === 'over') drawCar(player.x, player.y, '#6b1d22', .6, true);

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD
    if (state !== 'menu' && player) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(16, 16, 200, 70, 14); ctx.fill();
      roundRect(W - 176, 16, 160, 70, 14); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.font = '600 16px system-ui'; ctx.fillText('SCORE', 32, 36);
      ctx.font = 'bold 30px system-ui'; ctx.fillText(score, 32, 64);
      ctx.textAlign = 'right';
      ctx.font = '600 16px system-ui'; ctx.fillText('KM/H', W - 32, 36);
      ctx.font = 'bold 30px system-ui'; ctx.fillText(Math.round(speed / 4), W - 32, 64);
    }
  }

  function loop(t) {
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
