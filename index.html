<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Route Rush</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; background: #111; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    /* Format portrait 9:16 */
    aspect-ratio: 9 / 16; max-width: 100%;
    height: min(100%, calc(100vw * 16 / 9));
    overflow: hidden; background: #c9d6df;
    --fs: min(4.2vw, 2.35dvh);
  }
  #wrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- HUD de course ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; color: #fff; font-size: var(--fs); }
  .hud {
    position: absolute; top: 3%; padding: 2% 4%; border-radius: 12px;
    background: rgba(0,0,0,.45); font-variant-numeric: tabular-nums;
  }
  .hud small { display: block; font-size: calc(var(--fs) * .72); font-weight: 600; letter-spacing: 1px; opacity: .85; }
  .hud b { display: block; font-size: calc(var(--fs) * 1.45); }
  .hud.tl { left: 3%; min-width: 30%; }
  .hud.tr { right: 3%; min-width: 30%; text-align: right; }
  #popup {
    position: absolute; left: 0; right: 0; top: 20%; text-align: center; font-weight: 900;
    font-size: calc(var(--fs) * 1.7); letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,.7); opacity: 0;
  }
  #popup small { display: block; font-size: .6em; color: #ffd23f; }
  #popup.show { animation: pop 1.4s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.12); }
    25% { transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40%); }
  }
  #speedo {
    position: absolute; left: 4%; bottom: 4%; width: 46%; padding: 2.4% 4% 3%;
    border-radius: 14px; background: rgba(0,0,0,.5); font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; gap: .35em;
  }
  #speedo .row { display: flex; align-items: baseline; justify-content: space-between; gap: .4em; }
  #speedo b { font-size: calc(var(--fs) * 2.3); line-height: 1; }
  #speedo span { font-size: calc(var(--fs) * .75); opacity: .8; }
  #speedo .gear { font-size: calc(var(--fs) * 1.6); font-weight: 800; color: #ffd23f; min-width: 1.2em; text-align: right; }
  .rpm { height: .5em; border-radius: 9px; background: rgba(255,255,255,.18); overflow: hidden; }
  .rpm i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3ddc84, #ffd23f 70%, #ff3b30); }
  #brake {
    position: absolute; right: 4%; bottom: 4%; width: 27%; aspect-ratio: 1; border-radius: 20px;
    border: 3px solid rgba(255,255,255,.55); background: rgba(190,20,20,.45); color: #fff;
    font: inherit; font-weight: 800; letter-spacing: 1px; pointer-events: auto; touch-action: none;
  }
  #brake.on { background: rgba(255,40,40,.85); border-color: #fff; }
  #mute {
    position: absolute; top: 3.2%; left: 50%; transform: translateX(-50%); pointer-events: auto;
    width: 2.6em; height: 2.6em; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: var(--fs);
  }

  /* ---------- Menus ---------- */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4%;
    background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.65)); color: #fff; text-align: center; padding: 8%;
    font-size: var(--fs);
  }
  .overlay h1 { font-size: calc(var(--fs) * 2.5); letter-spacing: 2px; text-shadow: 0 4px 0 #e63946; text-wrap: balance; line-height: 1.05; }
  .overlay p { line-height: 1.4; opacity: .92; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .btn {
    font: inherit; font-size: calc(var(--fs) * 1.35); font-weight: 800; padding: .55em 1.6em; border: 0;
    border-radius: 999px; background: #ffd23f; color: #111; box-shadow: 0 6px 0 #b8901a; cursor: pointer;
  }
  .btn.alt { background: #fff; box-shadow: 0 6px 0 #9aa0a6; font-size: var(--fs); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8901a; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .hidden { display: none !important; }

  #menu { justify-content: space-between; padding: 6% 5% 7%; gap: 0;
    background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, rgba(0,0,0,.82) 70%); }
  #menu .top { display: flex; flex-direction: column; gap: .3em; }
  #menu .top p { font-size: calc(var(--fs) * .85); }
  .panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: .7em; }
  .pick { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: .5em; }
  .arrow {
    flex: none; width: 2.4em; height: 2.4em; border-radius: 50%; border: 2px solid rgba(255,255,255,.7);
    background: rgba(0,0,0,.35); color: #fff; font-size: calc(var(--fs) * 1.2); font-weight: 700; cursor: pointer;
  }
  .arrow:active { background: rgba(255,255,255,.25); }
  .car-name { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  .car-name small { font-size: calc(var(--fs) * .8); letter-spacing: 3px; text-transform: uppercase; opacity: .8; }
  .car-name strong { font-size: calc(var(--fs) * 1.55); text-wrap: balance; }
  .car-name span { font-size: calc(var(--fs) * .8); color: #ffd23f; font-weight: 700; letter-spacing: 1px; }
  .specs { font-size: calc(var(--fs) * .85); font-variant-numeric: tabular-nums; }
  .stats { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: .35em .7em; align-items: center; font-size: calc(var(--fs) * .78); }
  .stats label { text-align: left; letter-spacing: 1px; text-transform: uppercase; opacity: .85; }
  .bar { height: .55em; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #ffd23f; border-radius: 99px; transition: width .35s; }
  .swatches { display: flex; gap: .7em; justify-content: center; }
  .sw { width: 2em; height: 2em; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); cursor: pointer; }
  .sw[aria-pressed="true"] { border-color: #fff; transform: scale(1.12); }
  #colorName { font-size: calc(var(--fs) * .8); opacity: .85; min-height: 1.4em; }
  .hint { font-size: calc(var(--fs) * .72); opacity: .75 !important; }
  .dots { display: flex; gap: .4em; }
  .dots i { width: .5em; height: .5em; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dots i.on { background: #ffd23f; }
  .credit { font-size: calc(var(--fs) * .6); opacity: .6 !important; min-height: 1em; }
  .row { display: flex; gap: .8em; flex-wrap: wrap; justify-content: center; align-items: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" class="hidden">
    <div class="hud tl"><small>SCORE</small><b id="score">0</b></div>
    <div class="hud tr"><small>DISTANCE</small><b id="dist">0,00 km</b></div>
    <button id="mute" aria-label="Couper le son">🔊</button>
    <div id="popup"></div>
    <div id="speedo">
      <div class="row"><b id="kmh">0</b><span>km/h</span><div class="gear" id="gear">1</div></div>
      <div class="rpm"><i id="rpm"></i></div>
    </div>
    <button id="brake" aria-label="Frein">FREIN</button>
  </div>
  <div id="menu" class="overlay">
    <div class="top">
      <h1>ROUTE RUSH</h1>
      <p id="best"></p>
    </div>
    <div class="panel">
      <div class="dots" id="dots"></div>
      <div class="pick">
        <button class="arrow" id="prev" aria-label="Voiture précédente">‹</button>
        <div class="car-name"><small id="brand"></small><strong id="model"></strong><span id="gen"></span></div>
        <button class="arrow" id="next" aria-label="Voiture suivante">›</button>
      </div>
      <p class="specs" id="specs"></p>
      <div class="stats">
        <label>Vitesse</label><div class="bar"><i id="stV"></i></div>
        <label>Accél.</label><div class="bar"><i id="stA"></i></div>
        <label>Tenue</label><div class="bar"><i id="stH"></i></div>
      </div>
      <div class="swatches" id="swatches"></div>
      <p id="colorName"></p>
      <button class="btn" id="play">JOUER</button>
      <p class="credit" id="modelStatus"></p>
      <p class="credit" id="credit"></p>
      <p class="hint">Glisse le doigt pour changer de voie. Un coup de volant sec fait décrocher l'arrière. Frôle le trafic pour marquer des points.</p>
    </div>
  </div>
  <div id="over" class="overlay hidden">
    <h1>CRASH !</h1>
    <p id="final"></p>
    <div class="row">
      <button class="btn" id="again">REJOUER</button>
      <button class="btn alt" id="garage">GARAGE</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script src="vendor/Sky.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  if (!window.THREE) { $('menu').innerHTML = '<h1>Oups</h1><p>Le moteur 3D n’a pas pu se charger. Vérifie ta connexion puis recharge la page.</p>'; return; }

  // ---------- Géométrie de l'autoroute (mètres, m/s) ----------
  // Sens de circulation vers -z. Voie 0 = voie rapide (gauche), voie 3 = voie lente (droite), puis la BAU.
  const LANES = 4, LANE_W = 3.5;
  const laneX = i => -5.25 + i * LANE_W;
  const oppLaneX = i => -11.45 - i * LANE_W;           // chaussée d'en face, de l'autre côté du TPC
  const ROAD_X0 = -8, ROAD_W = 18;                       // bande dérasée gauche 1 m + 4 voies + BAU 3 m
  const EDGE_L = -7.95, EDGE_R = 9.95;                   // glissières
  const VIEW_LEN = 960, BACK = 60;                       // monde de z = +60 à z = -900
  const SPAN = VIEW_LEN;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- Rendu ----------
  const wrap = $('wrap');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .72;
  wrap.prepend(renderer.domElement);
  const ANISO = renderer.capabilities.getMaxAnisotropy();

  const HAZE = 0xc4d2dc;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(HAZE);
  scene.fog = new THREE.FogExp2(HAZE, .0012);
  const camera = new THREE.PerspectiveCamera(56, 9 / 16, 0.1, 30000);

  function resize() {
    const r = wrap.getBoundingClientRect();
    renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
    camera.aspect = r.width / r.height || 9 / 16;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // Ciel physique et soleil de fin d'après-midi, à l'avant droite
  const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 17), THREE.MathUtils.degToRad(125));
  function makeSky() {
    const s = new THREE.Sky(); s.scale.setScalar(20000);
    const u = s.material.uniforms;
    u.turbidity.value = 4.5; u.rayleigh.value = 1.4; u.mieCoefficient.value = .004; u.mieDirectionalG.value = .83;
    u.sunPosition.value.copy(sunDir);
    return s;
  }
  const pmrem = new THREE.PMREMGenerator(renderer);
  if (THREE.Sky) {
    scene.add(makeSky());
    const envScene = new THREE.Scene(); envScene.add(makeSky());
    scene.environment = pmrem.fromScene(envScene).texture;
  } else if (THREE.RoomEnvironment) {
    scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), .04).texture;
  }
  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x5d5443, .35));
  const sun = new THREE.DirectionalLight(0xffe2c0, 2.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 34, bottom: -34, near: 20, far: 260 });
  sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
  scene.add(sun, sun.target);

  // ---------- Textures générées (couleur, rugosité, relief) ----------
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function tex(c, rx, ry, color) {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = ANISO;
    if (color) t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function grain(g, w, h, amp, r) {
    const id = g.getImageData(0, 0, w, h), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * amp; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(id, 0, 0);
  }
  // Asphalte : 18 m de large × 26 m de long (2 périodes de marquage 3 m / 10 m)
  const RT = 26;
  function paintRoad(mode) {
    const w = 1024, h = 1024, c = canvas(w, h), g = c.getContext('2d'), r = rng(7);
    const SX = w / ROAD_W, SY = h / RT, X = m => m * SX, Y = m => m * SY;
    const C = { color: '#3b3c40', rough: '#dcdcdc', bump: '#808080' }[mode];
    g.fillStyle = C; g.fillRect(0, 0, w, h);
    if (mode === 'color') { g.fillStyle = '#46474a'; g.fillRect(X(15.2), 0, X(2.8), h); }       // BAU plus claire
    // réparations et taches
    for (let i = 0; i < 9; i++) {
      const x = r() * w, y = r() * h, pw = X(1 + r() * 4), ph = Y(2 + r() * 6), dark = r() < .6;
      g.fillStyle = mode === 'color' ? (dark ? 'rgba(18,18,20,.22)' : 'rgba(255,255,255,.05)')
                  : mode === 'rough' ? (dark ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.05)') : 'rgba(0,0,0,0)';
      g.fillRect(x, y, pw, ph);
    }
    // traces de pneus polies au milieu de chaque voie
    for (const lc of [2.75, 6.25, 9.75, 13.25]) for (const s of [-.85, .85]) {
      const x0 = X(lc + s - .35), x1 = X(lc + s + .35), gr = g.createLinearGradient(x0, 0, x1, 0);
      const k = mode === 'color' ? 'rgba(12,12,14,' : mode === 'rough' ? 'rgba(0,0,0,' : 'rgba(128,128,128,';
      gr.addColorStop(0, k + '0)'); gr.addColorStop(.5, k + (mode === 'rough' ? '.22)' : '.25)')); gr.addColorStop(1, k + '0)');
      g.fillStyle = gr; g.fillRect(x0, 0, x1 - x0, h);
    }
    // fissures
    g.lineCap = 'round';
    for (let i = 0; i < 14; i++) {
      g.strokeStyle = mode === 'bump' ? 'rgba(0,0,0,.7)' : mode === 'rough' ? 'rgba(255,255,255,.2)' : 'rgba(10,10,12,.55)';
      g.lineWidth = 1 + r() * 1.5; g.beginPath();
      let x = r() * w, y = r() * h; g.moveTo(x, y);
      for (let k = 0; k < 6; k++) { x += (r() - .5) * 40; y += (r() - .3) * 50; g.lineTo(x, y); }
      g.stroke();
    }
    // marquage : lignes continues de rive, lignes discontinues entre voies
    g.fillStyle = { color: '#e6e6df', rough: '#8a8a8a', bump: '#a8a8a8' }[mode];
    g.fillRect(X(.9), 0, X(.2), h);
    g.fillRect(X(14.93), 0, X(.25), h);
    for (const m of [4.5, 8, 11.5]) for (const y0 of [0, 13]) g.fillRect(X(m - .075), Y(y0), X(.15), Y(3));
    // usure des marquages + gravillons
    for (let i = 0; i < 9000; i++) {
      g.fillStyle = mode === 'color' ? (r() < .7 ? 'rgba(59,60,64,.55)' : 'rgba(170,170,165,.25)') : mode === 'rough' ? 'rgba(220,220,220,.3)' : 'rgba(60,60,60,.5)';
      g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
    }
    grain(g, w, h, { color: 22, rough: 40, bump: 110 }[mode], r);
    return c;
  }
  const roadMaps = { map: tex(paintRoad('color'), 1, VIEW_LEN / RT, true), roughnessMap: tex(paintRoad('rough'), 1, VIEW_LEN / RT), bumpMap: tex(paintRoad('bump'), 1, VIEW_LEN / RT) };
  const oppMaps = {};
  for (const k in roadMaps) { const t = roadMaps[k].clone(); t.needsUpdate = true; t.repeat.set(-1, VIEW_LEN / RT); oppMaps[k] = t; }

  // Herbe : tuile de 24 m
  const GT = 24;
  function paintGrass(mode) {
    const w = 1024, c = canvas(w, w), g = c.getContext('2d'), r = rng(11);
    g.fillStyle = mode === 'color' ? '#56702f' : '#808080'; g.fillRect(0, 0, w, w);
    const cols = ['#61803a', '#4a6328', '#7a8a42', '#8c8a4c', '#52713a', '#6d7f35'];
    for (let i = 0; i < 500; i++) {
      const x = r() * w, y = r() * w, rad = 10 + r() * 90, gr = g.createRadialGradient(x, y, 0, x, y, rad);
      const col = mode === 'color' ? cols[Math.floor(r() * cols.length)] : (r() < .5 ? '#6a6a6a' : '#969696');
      gr.addColorStop(0, col + '88'); gr.addColorStop(1, col + '00');
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    for (let i = 0; i < 26000; i++) {
      const x = r() * w, y = r() * w, l = 2 + r() * 5;
      g.strokeStyle = mode === 'color' ? `hsla(${75 + r() * 30},${35 + r() * 25}%,${22 + r() * 22}%,.55)` : `rgba(${r() < .5 ? '40,40,40' : '210,210,210'},.5)`;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 2, y - l); g.stroke();
    }
    grain(g, w, w, mode === 'color' ? 16 : 70, r);
    return c;
  }
  const GL = VIEW_LEN + 200;
  const grassMaps = { map: tex(paintGrass('color'), 2400 / GT, GL / GT, true), bumpMap: tex(paintGrass('bump'), 2400 / GT, GL / GT) };

  // Parcelles de campagne au loin : tuile de 480 m
  const FT = 480;
  const fieldTex = (() => {
    const w = 1024, c = canvas(w, w), g = c.getContext('2d'), r = rng(23);
    g.fillStyle = '#5f7a36'; g.fillRect(0, 0, w, w);
    const cols = ['#b59c5a', '#c7b06a', '#7d8f3e', '#5b7432', '#8a6b4a', '#6f8a3a', '#a89a55', '#4f6a2e'];
    let y = 0;
    while (y < w) {
      const ph = 60 + r() * 140; let x = 0;
      while (x < w) {
        const pw = 80 + r() * 220, col = cols[Math.floor(r() * cols.length)];
        g.fillStyle = col; g.fillRect(x + 2, y + 2, pw - 4, ph - 4);
        if (r() < .5) { g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 1; for (let k = 4; k < ph - 4; k += 5) { g.beginPath(); g.moveTo(x + 2, y + k); g.lineTo(x + pw - 2, y + k); g.stroke(); } }
        g.fillStyle = 'rgba(40,60,25,.9)'; g.fillRect(x, y, pw, 3);                    // haies
        x += pw;
      }
      y += ph;
    }
    grain(g, w, w, 18, r);
    return tex(c, 1, 1, true);
  })();

  function smokeTexture() {
    const c = canvas(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.4, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const SMOKE_TEX = smokeTexture();

  // ---------- Matériaux partagés ----------
  const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color }, o));
  const MAT = {
    glass: std(0x10161d, { metalness: .9, roughness: .06 }),
    tire: std(0x151515, { roughness: .92 }),
    head: std(0xfff6d0, { emissive: 0xfff2b0, emissiveIntensity: .9 }),
    tail: std(0x7a0808, { emissive: 0xff1010, emissiveIntensity: .7 }),
    blink: std(0xff9a1a, { emissive: 0xff8a00, emissiveIntensity: 3 }),
    white: std(0xf4f4f0, { roughness: .4 }),
    black: std(0x0e0e10, { roughness: .6 }),

  function extrude(pts, width, L, bevel) {
    const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    const bt = Math.min(bevel, width * .2);
    const depth = width - 2 * bt;
    const g = new THREE.ExtrudeGeometry(shape, {
      depth, bevelEnabled: true, bevelThickness: bt, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 2, curveSegments: 4,
    });
    g.translate(0, 0, -depth / 2);
    g.rotateY(Math.PI / 2);
    g.translate(0, 0, L / 2);
    return g;

  const geoCache = new Map();
  function carGeo(def) {
    if (!geoCache.has(def.id)) {
      const pr = def.body ? def : profileFrom(def);
      const cw = def.W * (def.cw || .8);
      geoCache.set(def.id, {
        body: extrude(pr.body, def.W, def.L, .06),
        cabin: extrude(pr.cabin, cw, def.L, .09),
        roof: extrude(roofFrom(pr.cabin), cw + .02, def.L, .02),
        pr,
      });
    }
    return geoCache.get(def.id);
  }

  function badge(g, kind, y, z) {
    if (kind === 'audi') { for (let i = 0; i < 4; i++) mesh(g, TORUS, MAT.chrome, .07, .07, .07, (i - 1.5) * .1, y, z); }
    else if (kind === 'renault') { const m = box(g, MAT.chrome, .12, .12, .03, 0, y, z, false); m.rotation.z = Math.PI / 4; }
    else if (kind === 'bmw') { mesh(g, CYLZ, MAT.chrome, .07, .07, .03, 0, y, z); mesh(g, CYLZ, bodyMat(0x1a5fb4), .05, .05, .035, 0, y, z); }
    else if (kind === 'porsche') { box(g, MAT.chrome, .5, .05, .03, 0, y, z, false); }
    else if (kind === 'ferrari') { box(g, bodyMat(0xf6c700), .07, .09, .03, 0, y, z, false); }
    else mesh(g, CYLZ, MAT.chrome, .08, .08, .03, 0, y, z);

  function makeTruck(color) {

    box(g, bm, W, 2.3, 2.4, 0, r + 1.3, -L / 2 + 1.2);
    box(g, MAT.glass, W * .92, .8, .1, 0, r + 1.9, -L / 2 - .02);
    box(g, MAT.cargo, W + .1, 3.0, L - 2.8, 0, r + 1.7, 1.3);
    box(g, MAT.black, W * .9, .4, L, 0, r + .1, 0);
    const tailMat = MAT.tail.clone(); g.userData.tailMat = tailMat;
    g.userData.blink = { '-1': [], '1': [] };
    for (const s of [-1, 1]) {
      box(g, tailMat, .3, .14, .06, s * (W / 2 - .25), r + .5, L / 2 + .02, false);
      box(g, MAT.head, .3, .14, .06, s * (W / 2 - .3), r + .6, -L / 2 - .02, false);
      for (const z of [L / 2 + .03, -L / 2 - .03]) { const b = box(g, MAT.blink, .16, .1, .05, s * (W / 2 - .08), r + .75, z, false); b.visible = false; g.userData.blink[s].push(b); }
    }

    g.userData.wheels = [];
    for (const z of [-L / 2 + 1.3, L / 2 - 2.6, L / 2 - 1.2]) for (const s of [-1, 1]) {
      const w = new THREE.Group(); w.position.set(s * (W / 2 - .15), r, z);
      mesh(w, CYL, MAT.tire, .3, r, r, 0, 0, 0).castShadow = true;
      mesh(w, CYL, rimMat(0xcfd3d8), .32, r * .55, r * .55, 0, 0, 0);
      g.add(w); g.userData.wheels.push(w);

    return g;

  function makeCar(def, color) {
    if (def.truck) return makeTruck(color);
    if (def.model3d) return fromGlb(def, color);
    const g = new THREE.Group(), bm = bodyMat(color), G = carGeo(def), { L, W, r } = def;
    const Z = x => L / 2 - x;
    const add = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; g.add(m); return m; };
    add(G.body, bm); add(G.cabin, MAT.glass); add(G.roof, bm);
    const p = G.pr.body ? def : def; // cotes pour les feux
    const tl = def.tl || [0, def.tailH - .15];
    const hl = def.hl || [L, def.nose - .2];
    const pl = def.plate || [0, def.sill + .3];
    const plF = def.plateF || [L, def.sill + .24];

    for (const s of [-1, 1]) {
      box(g, tailMat, tlW, .12, .06, s * (W / 2 - tlW / 2 - .06), tl[1], Z(tl[0]) + .02, false);
      // clignotants (arrière et avant)
      for (const [zz, yy] of [[Z(tl[0]) + .03, tl[1] + .1], [Z(hl[0]) - .03, hl[1]]]) {
        const b = box(g, MAT.blink, .1, .07, .05, s * (W / 2 - .06), yy, zz, false); b.visible = false; g.userData.blink[s].push(b);
      }
      box(g, MAT.head, .36, .1, .06, s * (W / 2 - .3), hl[1], Z(hl[0]) - .02, false);
      // rétroviseurs
      const cab = G.pr.cabin[3];
      box(g, bm, .16, .1, .18, s * (W / 2 + .06), cab[1] + .12, Z(cab[0] - .12));
    }
    if (def.tlBar) box(g, tailMat, W * .8, .04, .05, 0, tl[1] + .05, Z(tl[0]) + .02, false);
    // plaques françaises (blanches, bande bleue à gauche)
    for (const [pp, dir] of [[pl, 1], [plF, -1]]) {

  // ---------- Vrais modèles 3D (.glb) ----------
  // Le modèle est remis à l'échelle (longueur réelle), posé au sol et orienté nez vers -z.
  function prepareGlb(def, gltf) {
    const root = gltf.scene;
    let b = new THREE.Box3().setFromObject(root), size = b.getSize(new THREE.Vector3());
    if (size.x > size.z) { root.rotation.y = Math.PI / 2; }
    if (def.glbFlip) root.rotation.y += Math.PI;
    root.updateMatrixWorld(true);
    b = new THREE.Box3().setFromObject(root); size = b.getSize(new THREE.Vector3());
    const k = def.L / size.z;
    root.scale.multiplyScalar(k);
    root.updateMatrixWorld(true);
    b = new THREE.Box3().setFromObject(root);
    const c = b.getCenter(new THREE.Vector3());
    root.position.x -= c.x; root.position.z -= c.z; root.position.y -= b.min.y;
    const brake = new Set();
    root.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.frustumCulled = false;
      for (const m of [].concat(o.material)) if (/brake|rearlight|taillight|red_glass/i.test(m.name)) brake.add(m);
    });
    def.brakeMats = [...brake].map(m => ({ m, e: m.emissive.clone(), i: m.emissiveIntensity }));
    const holder = new THREE.Group(); holder.add(root);
    def.model3d = holder;
  }
  function fromGlb(def, color) {
    const g = def.model3d.clone(true);
    const key = def.id + color;
    g.traverse(o => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      o.material = mats.map(m => {
        if (!def.paint.test(m.name)) return m;
        if (!matCache.has(key)) {
          const p = new THREE.MeshPhysicalMaterial({ color, metalness: .55, roughness: .3, clearcoat: 1, clearcoatRoughness: .05, name: m.name });
          p.color.convertSRGBToLinear();
          matCache.set(key, p);
        }
        return matCache.get(key);
      });
      if (o.material.length === 1) o.material = o.material[0];
    });
    g.userData.wheels = [];
    return g;
  }
  // Le modèle est livré dans un .js (base64) : ça marche partout, même en file:// et sur les
  // hébergeurs qui ne servent pas les .glb.
  function setModelStatus(def, text) {
    def.status = text;
    if (player.def === def) $('modelStatus').textContent = text;
  }
  function loadModel(def) {
    if (!def.glb || def.model3d || def.loading) return;
    def.loading = true;
    {
      if (!THREE.GLTFLoader) { setModelStatus(def, 'Modèle 3D indisponible : chargeur absent'); return; }
      setModelStatus(def, 'Chargement du modèle 3D…');
      const fail = why => { def.loading = false; setModelStatus(def, 'Modèle 3D non chargé : ' + why); };
      const sc = document.createElement('script');
      sc.src = def.glb + '.js';
      sc.onerror = () => fail('fichier introuvable');
      sc.onload = () => {
        try {
          const b64 = (window.RR_MODELS || {})[def.id];
          if (!b64) return fail('fichier vide');
          const str = atob(b64), bin = new Uint8Array(str.length);
          for (let i = 0; i < str.length; i++) bin[i] = str.charCodeAt(i);
          delete window.RR_MODELS[def.id];
          new THREE.GLTFLoader().parse(bin.buffer, '', gltf => {
            try { prepareGlb(def, gltf); setModelStatus(def, ''); if (player.def === def) setPlayerCar(); }
            catch (e) { fail(e.message || e); }
          }, e => fail((e && e.message) || e));
        } catch (e) { fail(e.message || e); }
      };
      document.head.appendChild(sc);
    }
  }

  const scrollers = [];

  function scroller(geo, mat, items, opts = {}) {

  const audio = { ctx: null, muted: lsGet('rr_mute') === '1' };
  function audioInit() {
    try {
      if (audio.ctx) { audio.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = new AC(); audio.ctx = c;
      const master = c.createGain(); master.gain.value = audio.muted ? 0 : .8; master.connect(c.destination);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
      const eg = c.createGain(); eg.gain.value = 0; lp.connect(eg); eg.connect(master);
      const oscs = [['sawtooth', 1, .5], ['square', .5, .35], ['sawtooth', 2.005, .18]].map(([type, mul, vol]) => {
        const o = c.createOscillator(); o.type = type; const g = c.createGain(); g.gain.value = vol;
        o.connect(g); g.connect(lp); o.start(); return { o, mul };
      });
      const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const noise = (type, f, q) => {
        const n = c.createBufferSource(); n.buffer = buf; n.loop = true;
        const flt = c.createBiquadFilter(); flt.type = type; flt.frequency.value = f; flt.Q.value = q;
        const g = c.createGain(); g.gain.value = 0; n.connect(flt); flt.connect(g); g.connect(master); n.start(); return g;
      };

    } catch (e) { audio.ctx = null; }
  }
  function audioUpdate(active, rpm, load, v, slip) {
    if (!audio.ctx || !audio.oscs) return;
    const t = audio.ctx.currentTime, P = player.def, f = rpm / 60 * P.pulses;
    for (const { o, mul } of audio.oscs) o.frequency.setTargetAtTime(f * mul, t, .03);
    audio.lp.frequency.setTargetAtTime(300 + (rpm / P.redline) * 2400 * (.45 + .55 * load), t, .05);
    audio.eg.gain.setTargetAtTime(active ? .07 + .07 * load : 0, t, .12);
    audio.wind.gain.setTargetAtTime(active ? Math.min(.22, v * v / 30000) : 0, t, .2);
    audio.screech.gain.setTargetAtTime(active ? Math.min(.28, slip * 2.2) : 0, t, .05);
  }
  function setMute(m) {

  // =====================================================================

  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  let state = 'menu', time = 0, last, menuAngle = 0, shake = 0;
  let npcs = [], opp = [], dist = 0, score = 0, bonus = 0, combo = 0, comboT = 0, driftPts = 0, npcSpawnT = 0, oppSpawnT = 0;
  let best = +(lsGet('rr_best') || 0);
  let carIdx = Math.max(0, PLAYER_CARS.findIndex(c => c.id === lsGet('rr_car')));
  let colorIdx = PLAYER_CARS.map(c => +(lsGet('rr_color_' + c.id) || 0));

  const car = { x: laneX(2), v: 12, phi: 0, psi: 0, psiV: 0, gear: 1, rpm: 1000, spin: 0, slip: 0 };

  // ---------- Contrôles ----------
  const input = { left: false, right: false, brake: false };
  const clampX = x => clamp(x, EDGE_L + 1, EDGE_R - 1);
  let drag = null;

    player.tx = drag.tx;

  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id || state !== 'play') return;

  const endTouch = e => { if (drag && e.pointerId === drag.id) { drag = null; input.left = input.right = false; } };
  window.addEventListener('pointerup', endTouch);

  $('mute').onclick = () => setMute(!audio.muted);
  const isL = k => k === 'ArrowLeft' || k === 'q' || k === 'a', isR = k => k === 'ArrowRight' || k === 'd';
  const isB = k => k === 'ArrowDown' || k === 's' || k === ' ';
  window.addEventListener('keydown', e => {

    if (state === 'menu' && isR(e.key)) return switchCar(1);
    if (state !== 'play' && (e.key === 'Enter' || e.key === ' ')) return start();
    if (isL(e.key)) input.left = true;
    if (isR(e.key)) input.right = true;
    if (isB(e.key)) setBrake(true);
  });
  window.addEventListener('keyup', e => {
    if (isL(e.key)) input.left = false;
    if (isR(e.key)) input.right = false;
    if (isB(e.key)) setBrake(false);
  });
  $('play').onclick = start;
  $('again').onclick = start;
  $('garage').onclick = toGarage;

  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  function popup(title, pts) {
    const el = $('popup');
    el.innerHTML = `${title}<small>+${pts}${combo > 1 ? ' · x' + combo : ''}</small>`;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  function clearCars(list) { for (const o of list) scene.remove(o.mesh); list.length = 0; }
  function resetRun(v) {
    clearCars(npcs); clearCars(opp);
    for (const k of skids) k.z = 1e4;
    Object.assign(car, { x: laneX(2), v, phi: 0, psi: 0, psiV: 0, gear: 1, spin: 0, slip: 0 });
    player.tx = car.x;
    player.mesh.rotation.set(0, 0, 0); player.mesh.position.set(car.x, 0, 0);
    dist = 0; score = 0; bonus = 0; combo = 0; comboT = 0; driftPts = 0; shake = 0;
    npcSpawnT = 0; oppSpawnT = 0;
  }
  function start() {
    audioInit();
    resetRun(115 / 3.6); state = 'play';
    // trafic déjà présent devant, sauf juste devant le joueur
    for (let z = -70; z > -520; z -= rand(22, 40)) spawnNpc(z, true);
    for (let z = -100; z > -800; z -= rand(80, 160)) spawnOpp(z);
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('hud').classList.remove('hidden');
    buzz(20);
  }
  function toGarage() {

    $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); $('hud').classList.add('hidden');
    renderGarage();
  }
  function gameOver(hit) {
    state = 'over'; shake = 1.2;
    car.spin = (hit.x > car.x ? -1 : 1) * rand(3, 6);
    hit.v = Math.max(0, hit.v - 8); hit.hit = true;
    burst(car.x, .8, -player.def.L / 2, 26, [0x111111, 0x2a2a2a, player.def.colors[colorIdx[carIdx]][0], 0xdfe6ea], 10);
    for (let i = 0; i < 10; i++) puff(car.x + rand(-1, 1), .6, rand(-2, 1), 1, 0x9a9a9a);

    setTimeout(() => {

      $('final').innerHTML = `${player.def.brand} ${player.def.model}<br>Score : <b>${score}</b><br>` +
        `Distance : ${(dist / 1000).toFixed(2).replace('.', ',')} km<br>Record : ${best}`;
      $('over').classList.remove('hidden'); $('hud').classList.add('hidden');
    }, 1300);
  }

  // ---------- Trafic : IA avec gestion des distances et changements de voie ----------
  const TRUCK_COLORS = [0x1d3557, 0xc1121f, 0xf4f4f4, 0x2d6a4f, 0x3a3a3a];
  const laneSpeed = (lane, truck) => truck ? rand(23, 25) : [rand(35, 39), rand(33, 36), rand(29, 33), rand(25, 29)][lane];
  const laneOf = x => clamp(Math.round((x + 5.25) / LANE_W), 0, LANES - 1);
  function laneClear(lane, z, len, self, gapAhead, gapBehind) {
    for (const o of npcs) {
      if (o === self) continue;
      const inLane = Math.abs(o.x - laneX(lane)) < 2.4 || (o.lc > 0 && o.tLane === lane);
      if (!inLane) continue;
      const dz = o.z - z, need = (o.def.L + len) / 2;
      if (dz < 0 && -dz < need + gapAhead) return false;       // devant
      if (dz >= 0 && dz < need + gapBehind) return false;      // derrière
    }
    return true;
  }
  function spawnNpc(z, initial) {
    const weights = [1, 2, 3, 3];
    let lane = 0, t = Math.random() * 9;
    for (let i = 0; i < 4; i++) { t -= weights[i]; if (t < 0) { lane = i; break; } }
    const def = pick(TRAFFIC_POOL);
    if (def.truck && lane < 2) lane = 2 + Math.floor(Math.random() * 2);
    if (initial && Math.abs(laneX(lane) - car.x) < 2 && z > -160) return;
    if (!laneClear(lane, z, def.L, null, 25, 25)) return;
    const color = def.truck ? pick(TRUCK_COLORS) : (Math.random() < .7 ? pick(FR) : pick(def.colors));
    const mesh = makeCar(def, color);
    const v = laneSpeed(lane, def.truck);
    const n = { mesh, def, lane, tLane: lane, x: laneX(lane), z, v, cruise: v, lc: 0, blink: 0, blinkT: 0, cool: rand(1, 5), passed: z > 0, x0: 0, dur: 2.5, yaw: 0 };
    mesh.position.set(n.x, 0, z);
    scene.add(mesh); npcs.push(n);
  }
  function spawnOpp(z) {
    const def = pick(TRAFFIC_POOL);
    const lane = def.truck ? 2 + Math.floor(Math.random() * 2) : Math.floor(Math.random() * 4);
    const mesh = makeCar(def, def.truck ? pick(TRUCK_COLORS) : pick(FR.concat(def.colors)));
    mesh.rotation.y = Math.PI; mesh.position.set(oppLaneX(lane), 0, z);
    scene.add(mesh); opp.push({ mesh, def, z, v: laneSpeed(lane, def.truck) });
  }

  function updateNpcs(dt, fwd) {
    const P = player.def;
    for (const n of npcs) {
      // véhicule qui précède (ou le joueur)
      let gap = 1e9, leadV = n.cruise;
      for (const o of npcs) {
        if (o === n || o.z >= n.z) continue;
        if (Math.abs(o.x - n.x) > (o.def.W + n.def.W) / 2 + .6) continue;
        const g = n.z - o.z - (o.def.L + n.def.L) / 2;
        if (g < gap) { gap = g; leadV = o.v; }
      }
      if (state === 'play' && n.z > 0 && Math.abs(car.x - n.x) < (P.W + n.def.W) / 2 + .6) {
        const g = n.z - (P.L + n.def.L) / 2; if (g < gap) { gap = g; leadV = fwd; }
      }
      const safe = 6 + n.v * .9;
      let want = n.cruise, blocked = false;
      if (gap < safe) { want = Math.min(want, leadV - (safe - gap) * .35); blocked = true; }
      const a = clamp((want - n.v) * 1.4, -8, 2);
      n.v = Math.max(0, n.v + a * dt);
      n.braking = a < -1.2;

      // décision de changement de voie (clignotant d'abord)
      n.cool -= dt;
      if (!n.hit && n.lc === 0 && n.blink === 0 && n.cool <= 0) {
        n.cool = rand(2, 6);
        let target = -1;
        if (blocked && gap < safe * 1.4) target = n.lane > 0 && Math.random() < .75 ? n.lane - 1 : n.lane + 1;  // dépassement par la gauche
        else if (n.lane < 3 && Math.random() < .35) target = n.lane + 1;                                          // se rabat à droite
        else if (Math.random() < .12) target = n.lane + (Math.random() < .5 ? -1 : 1);                              // changement spontané
        if (n.def.truck && target < 2) target = -1;
        if (target >= 0 && target < LANES && laneClear(target, n.z, n.def.L, n, 10, 12 + n.v * .4)) {
          n.tLane = target; n.blink = Math.sign(target - n.lane); n.blinkT = rand(.9, 1.6);
          n.careless = Math.random() < .15;   // certains ne regardent pas leurs rétros…
        }
      }
      if (n.blink && n.lc === 0) {
        n.blinkT -= dt;
        if (n.blinkT <= 0) {
          const playerThere = state === 'play' && Math.abs(car.x - laneX(n.tLane)) < 2.6 && n.z > -(12 + Math.max(0, fwd - n.v) * 1.2) && n.z < 14;
          if (laneClear(n.tLane, n.z, n.def.L, n, 8, 8) && (!playerThere || n.careless)) { n.lc = 1e-4; n.x0 = n.x; n.dur = rand(2.2, 3.4); }
          else if (n.blinkT < -2.5) { n.blink = 0; n.tLane = n.lane; }
        }
      }
      const px = n.x;
      if (n.lc > 0) {
        n.lc += dt / n.dur;
        const t = Math.min(1, n.lc), s = t * t * (3 - 2 * t);
        n.x = n.x0 + (laneX(n.tLane) - n.x0) * s;
        if (t >= 1) { n.lane = n.tLane; n.lc = 0; n.blink = 0; n.cruise = laneSpeed(n.lane, n.def.truck); }
      }
      n.z += (fwd - n.v) * dt;
      const vx = (n.x - px) / Math.max(dt, 1e-4);
      n.yaw += (-Math.atan2(vx, Math.max(n.v, 1)) - n.yaw) * Math.min(1, dt * 8);
      n.mesh.position.set(n.x, 0, n.z);
      n.mesh.rotation.y = n.yaw;
      for (const w of n.mesh.userData.wheels) w.rotation.x -= n.v * dt / n.def.r;
      const ud = n.mesh.userData;
      if (ud.tailMat) ud.tailMat.emissiveIntensity = n.braking ? 3.2 : .7;
      if (ud.blink) {
        const on = n.blink !== 0 && (time * 1.6) % 1 < .5;
        for (const s of ['-1', '1']) for (const b of ud.blink[s]) b.visible = on && +s === n.blink;
      }
    }
    for (const n of npcs) if (n.z > 120 || n.z < -900) scene.remove(n.mesh);
    npcs = npcs.filter(n => n.z <= 120 && n.z >= -900);

    // apparition : devant si on va plus vite qu'eux, derrière sinon
    if (state === 'play') {
      npcSpawnT -= dt;
      const target = Math.min(26, 14 + dist / 900);
      if (npcSpawnT <= 0 && npcs.length < target) {
        npcSpawnT = rand(.15, .5);
        if (fwd > 30) spawnNpc(-rand(480, 560));
        else { const before = npcs.length; spawnNpc(rand(90, 110)); if (npcs.length > before) { const n = npcs[npcs.length - 1]; n.v = n.cruise = Math.max(n.cruise, fwd + 6); } }
      }
    }
    // chaussée d'en face
    oppSpawnT -= dt;
    if (state !== 'menu' && oppSpawnT <= 0 && opp.length < 10) { oppSpawnT = rand(.8, 2.2); spawnOpp(-rand(850, 900)); }
    for (const o of opp) {
      o.z += (fwd + o.v) * dt; o.mesh.position.z = o.z;
      for (const w of o.mesh.userData.wheels) w.rotation.x -= o.v * dt / o.def.r;
    }
    for (const o of opp) if (o.z > 120) scene.remove(o.mesh);
    opp = opp.filter(o => o.z <= 120);
  }

  // ---------- Boîte de vitesses ----------
  function gearTop(g) { const P = player.def; return P.vmax / 3.6 * Math.pow(g / P.gears, .72); }
  function updateGearbox(v) {
    const P = player.def;
    const rpmAt = g => P.idle + (v / gearTop(g)) * (P.redline - P.idle);
    if (car.gear < P.gears && rpmAt(car.gear) > P.redline * .97) car.gear++;
    while (car.gear > 1 && rpmAt(car.gear - 1) < P.redline * .78) car.gear--;
    car.rpm = clamp(rpmAt(car.gear), P.idle, P.redline);
  }

  // ---------- Physique du joueur ----------
  function updatePlayer(dt) {
    const P = player.def, vv = Math.max(car.v, 6);
    let fwd;
    if (state === 'play') {
      // consigne de cap à partir du doigt ou des touches
      const maxSteer = clamp(11 / vv, .09, .5);
      let psiCmd = 0;
      if (drag && drag.moved) {
        const vlat = clamp((player.tx - car.x) * 2.4, -15, 15);
        psiCmd = clamp(Math.asin(clamp(vlat / vv, -.95, .95)), -maxSteer, maxSteer);
      } else if (input.left !== input.right) psiCmd = (input.right ? 1 : -1) * maxSteer;
      // la carrosserie suit le volant avec un ressort peu amorti : un coup sec fait survirer
      // (intégré en petits pas fixes pour rester stable même si le téléphone rame)
      const K = 60 * P.grip, D = 2 * Math.sqrt(K) * .38, n = Math.ceil(dt / (1 / 120)), h = dt / n;
      for (let i = 0; i < n; i++) {
        car.psiV += (K * (psiCmd - car.psi) - D * car.psiV) * h;
        car.psi = clamp(car.psi + car.psiV * h, -.75, .75);
        // la trajectoire suit le cap tant que les pneus accrochent
        const drifting = Math.abs(car.psi - car.phi) > .06;
        const om = P.gripG * 9.81 * 1.7 * (drifting ? .75 : 1) / vv;
        car.phi += clamp((car.psi - car.phi) * 9, -om, om) * h;
      }
      const beta = car.psi - car.phi;
      car.slip = car.v > 12 ? Math.max(0, Math.abs(beta) - .03) : 0;
      // longitudinal : accélérateur automatique, frein au bouton
      let a;
      if (input.brake) a = -10.5 * (.85 + .15 * P.grip) - .0004 * car.v * car.v;
      else a = P.a0 * Math.max(0, 1 - Math.pow(car.v / (P.vmax / 3.6), 2.1));
      a -= car.slip * car.v * 1.1;           // la glisse coûte de la vitesse
      car.v = Math.max(8, car.v + a * dt);
      fwd = car.v * Math.cos(car.phi);
      car.x += car.v * Math.sin(car.phi) * dt;
      // glissières : on frotte, étincelles, perte de vitesse
      const half = P.W / 2;
      for (const [lim, s] of [[EDGE_L + half, -1], [EDGE_R - half, 1]]) {
        if ((s < 0 && car.x < lim) || (s > 0 && car.x > lim)) {
          car.x = lim;
          if (Math.sign(car.phi) === s) { car.phi *= -.2; car.psi *= .4; car.psiV *= -.3; }
          car.v *= 1 - 1.4 * dt; shake = Math.max(shake, .25);
          if (Math.random() < .8) spark(car.x + s * half, .4, rand(-2, 2));
          if (Math.random() < .05) buzz(15);
        }
      }
      updateGearbox(car.v);
      // traces et fumée quand ça glisse ou freine fort
      const skidding = car.slip > .02 || (input.brake && car.v > 20);
      if (skidding) {
        const zr = P.L * .3, cps = Math.cos(car.psi), sps = Math.sin(car.psi);
        for (const lx of [-(P.W / 2 - .25), P.W / 2 - .25]) {
          const wx = car.x + lx * cps - zr * sps, wz = lx * sps + zr * cps, len = fwd * dt + .05;
          addSkid(wx, wz + len / 2, len, -car.phi);
          if (car.slip > .04 && Math.random() < .5) puff(wx, .35, wz + .4, car.slip * 4);
        }
      }
      // score : distance + drift
      if (car.slip > .04) driftPts += car.slip * car.v * dt * 12;
      else if (driftPts > 0) { const p = Math.round(driftPts); if (p >= 15) { bonus += p; popup('DRIFT', p); } driftPts = 0; }
      comboT -= dt; if (comboT <= 0) combo = 0;
      dist += fwd * dt;
      score = Math.floor(dist / 10) + bonus;
      audioUpdate(true, car.rpm, input.brake ? 0 : 1, car.v, car.slip + (input.brake && car.v > 20 ? .06 : 0));
    } else {
      if (state === 'over') { car.v = Math.max(0, car.v - 16 * dt); car.psi += car.spin * dt; car.spin *= 1 - dt * 1.2; car.phi *= 1 - dt; }
      fwd = car.v * Math.cos(car.phi);
      car.x += car.v * Math.sin(car.phi) * dt * .3;
      audioUpdate(false, 1000, 0, 0, 0);
    }
    const pm = player.mesh;
    pm.position.x = car.x;
    pm.rotation.y = -car.psi;
    pm.rotation.z = state === 'play' ? clamp(-(car.psi - car.phi) * .15 - car.psiV * .012, -.06, .06) : 0;   // roulis
    pm.rotation.x = state === 'play' ? (input.brake ? .012 : -.004) : 0;                                    // plongée / cabrage
    for (const w of pm.userData.wheels) w.rotation.x -= car.v * dt / P.r;
    // feux stop
    const bOn = input.brake && state === 'play';
    if (pm.userData.tailMat) pm.userData.tailMat.emissiveIntensity = bOn ? 3.5 : .7;
    for (const b of P.brakeMats || []) {
      if (bOn) { b.m.emissive.setHex(0xff1a1a); b.m.emissiveIntensity = 3; } else { b.m.emissive.copy(b.e); b.m.emissiveIntensity = b.i; }
    }
    return fwd;
  }

  function checkCollisions(fwd) {
    if (state !== 'play') return;
    const P = player.def;
    for (const n of npcs) {
      const dx = Math.abs(n.x - car.x), dz = Math.abs(n.z);
      if (dx < (n.def.W + P.W) / 2 * .9 && dz < (n.def.L + P.L) / 2 * .93) { gameOver(n); return; }
      // frôlé : on vient de dépasser de très près
      if (!n.passed && n.z > (n.def.L + P.L) / 2) {
        n.passed = true;
        const gap = dx - (n.def.W + P.W) / 2;
        if (gap < 1.1 && fwd - n.v > 6) {
          combo = comboT > 0 ? combo + 1 : 1; comboT = 4;
          const p = Math.round((60 + (1.1 - gap) * 120) * (fwd / 40) * combo);
          bonus += p; popup('FRÔLÉ !', p); buzz(12);
        }
      }
    }
  }

  // ---------- Caméra drone ----------
  const cam = { pos: new THREE.Vector3(6, 4, 9), look: new THREE.Vector3(0, 0, 0) };
  const want = new THREE.Vector3(), look = new THREE.Vector3();
  function updateCamera(dt) {
    if (state === 'menu') {
      menuAngle += dt * .28;
      want.set(car.x + Math.sin(menuAngle) * 10, 3.6 + Math.sin(time * .8) * .3, Math.cos(menuAngle) * 10);
      look.set(car.x, -2, 0);
      camera.fov += (48 - camera.fov) * Math.min(1, dt * 2);
    } else {
      const k = clamp((car.v - 30) / 55, 0, 1);
      const back = 9.5 + k * 2.6, h = 5.6 + k * 1.3 + Math.sin(time * 1.2) * .15;
      want.set(car.x - Math.sin(car.phi) * back * .8, h, back);
      look.set(car.x + Math.sin(car.phi) * 18, -.6, -16);
      camera.fov += ((54 + k * 16) - camera.fov) * Math.min(1, dt * 2);
      shake = Math.max(shake, k * .06);
    }
    camera.updateProjectionMatrix();
    const lag = state === 'menu' ? 1.5 : 3.4;
    cam.pos.lerp(want, Math.min(1, dt * lag));
    cam.look.lerp(look, Math.min(1, dt * lag * 1.6));
    camera.position.copy(cam.pos);
    if (shake > 0) { camera.position.x += (Math.random() - .5) * shake * .3; camera.position.y += (Math.random() - .5) * shake * .3; }
    camera.lookAt(cam.look);
    camera.rotateZ(-car.v * Math.sin(car.phi) * .004 + Math.sin(time * .9) * .004);
    shake = Math.max(0, shake - dt * 1.5);
    // l'ombre suit la voiture
    sun.target.position.set(car.x, 0, -14);
    sun.position.copy(sun.target.position).addScaledVector(sunDir, 150);
  }

  // ---------- Qualité adaptative (téléphones moins puissants) ----------
  let perfT = 0, perfN = 0;
  function adapt(dt) {
    if (state !== 'play' || pixelRatio <= 1) return;
    perfT += dt; perfN++;
    if (perfN === 90) {
      if (perfT / perfN > .026) { pixelRatio = Math.max(1, pixelRatio - .25); renderer.setPixelRatio(pixelRatio); resize(); }
      perfT = 0; perfN = 0;
    }
  }

  // ---------- Boucle ----------
  function update(dt) {
    time += dt;
    const fwd = updatePlayer(dt);
    const dz = fwd * dt;
    for (const [t, period] of scrollTex) t.offset.y = (t.offset.y + dz / period) % 1;
    for (const s of scrollers) moveScroller(s, dz);
    for (const h of houses) { h.position.z += dz; if (h.position.z > BACK + 20) h.position.z -= SPAN; }
    gantry.position.z += dz; if (gantry.position.z > BACK) { gantry.position.z -= rand(1400, 2200); dressGantry(gantry); }
    limitSign.position.z += dz; if (limitSign.position.z > BACK) limitSign.position.z -= rand(700, 1100);
    moveSkids(dz);
    updateEffects(dt, dz);
    updateNpcs(dt, fwd);
    checkCollisions(fwd);
    updateCamera(dt);
    adapt(dt);
    if (state === 'play') {
      $('score').textContent = score;
      $('dist').textContent = (dist / 1000).toFixed(2).replace('.', ',') + ' km';
      $('kmh').textContent = Math.round(car.v * 3.6);
      $('gear').textContent = car.gear;
      $('rpm').style.width = (car.rpm / player.def.redline * 100).toFixed(1) + '%';
    }
  }

  function loop(t) {
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
